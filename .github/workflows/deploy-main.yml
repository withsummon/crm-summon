name: Deploy CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python3 -m compileall -q crm
      - name: Build CRM frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          NODE_OPTIONS=--max-old-space-size=6144 yarn build
      - name: Package CRM assets
        run: tar -czf "$RUNNER_TEMP/crm-assets.tgz" crm/public/frontend crm/www/crm.html
      - name: Configure SSH
        env:
          CRM_DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
        run: |
          test -n "$CRM_DEPLOY_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CRM_DEPLOY_SSH_KEY" > "$HOME/.ssh/crm_deploy"
          chmod 600 "$HOME/.ssh/crm_deploy"
          printf '%s\n' '72.60.78.94 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINqhmkKEObEwYRVprpYwSZBJTdjSFvcyQ71b+0BdMhk2' > "$HOME/.ssh/known_hosts"
      - name: Deploy CRM on Frappe host
        run: |
          scp -i "$HOME/.ssh/crm_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/crm-assets.tgz" "frappe@72.60.78.94:/home/frappe/crm-assets-${GITHUB_SHA}.tgz"
          ssh -i "$HOME/.ssh/crm_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 frappe@72.60.78.94 "bash -s -- '${GITHUB_SHA}' '/home/frappe/crm-assets-${GITHUB_SHA}.tgz'" < deploy/github-main.sh
